name: Daily EPUB

# GitHub Pages wird nach jedem relevanten Commit und täglich neu veröffentlicht.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "config.json"
      - ".github/workflows/daily-epub.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: Tagesausgabe erzeugen
        run: python src/generate.py --config config.json --output dist/dailydigest.epub

      - name: EPUB-Struktur prüfen
        run: python -m zipfile --test dist/dailydigest.epub

      - name: Download-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: xteink-dailydigest
          path: |
            dist/dailydigest.epub
            dist/latest.json
            dist/opds.xml
          if-no-files-found: error
          retention-days: 7

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Pages-Paket hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
